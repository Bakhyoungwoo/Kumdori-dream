[project]
name = "ourcut-ai-engine"
version = "0.0.1"
description = "OURCUT AI compose engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "aiokafka",
    "langgraph",
    "langsmith",
    "openai",
    "pydantic-settings",
    "rembg",
    "mediapipe",
    "opencv-python-headless",
    "pillow",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
