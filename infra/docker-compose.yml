services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ourcut
      POSTGRES_USER: ourcut
      POSTGRES_PASSWORD: ourcut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ourcut
      MINIO_ROOT_PASSWORD: ourcut1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: ../backend
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"

  ai-engine:
    build: ../ai-engine
    depends_on:
      - kafka
      - minio
    ports:
      - "8001:8001"

volumes:
  postgres-data:
  minio-data:
