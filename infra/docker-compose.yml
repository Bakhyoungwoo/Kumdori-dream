services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ourcut
      POSTGRES_USER: ourcut
      POSTGRES_PASSWORD: ourcut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  backend:
    build: ../backend
    environment:
      JWT_SECRET: local-development-secret-change-me-please-32chars
      DB_URL: jdbc:postgresql://postgres:5432/ourcut
      DB_USERNAME: ourcut
      DB_PASSWORD: ourcut
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"

  ai-engine:
    build: ../ai-engine
    depends_on:
      - kafka
    ports:
      - "8001:8001"

volumes:
  postgres-data:
