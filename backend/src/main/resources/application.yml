spring:
  application:
    name: ourcut-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ourcut
    username: ourcut
    password: ourcut

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
