spring:
  application:
    name: ourcut-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ourcut}
    username: ${DB_USERNAME:ourcut}
    password: ${DB_PASSWORD:ourcut}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  internal-api-key: ${APP_INTERNAL_API_KEY:}
  outbox:
    topic: ${OUTBOX_KAFKA_TOPIC:compose.request}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-ms: ${OUTBOX_POLL_MS:1000}
  jobs:
    timeout-seconds: ${JOB_TIMEOUT_SECONDS:1800}
  quota:
    daily-image-limit: ${DAILY_IMAGE_LIMIT:20}
    global-image-limit: ${GLOBAL_IMAGE_LIMIT:10000}
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${AWS_S3_ENDPOINT:}
      presign-minutes: ${AWS_S3_PRESIGN_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
